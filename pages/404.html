<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Unavailable | Stackly</title>
    <meta
      name="description"
      content="The requested institutional page or resource could not be found. Navigate back to Stackly headquarters."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../assets/css/style.css" />
  </head>
  <body class="error-page-body">
    <!-- MAIN 404 CONTENT (No Navbar) -->
    <main
      id="main-content"
      class="error-page-wrapper"
      style="
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
      "
    >
      <div class="error-card">
        <!-- Brand Logo Header -->
        <div style="margin-bottom: 24px; text-align: center">
          <a
            href="../index.html"
            aria-label="Stackly Home"
            style="display: inline-block"
          >
            <img
              src="../assets/images/logoStackly.webp"
              alt="Stackly Logo"
              width="180"
              height="40"
              style="
                height: 40px;
                max-width: 180px;
                object-fit: contain;
                display: block;
                margin: 0 auto;
              "
            />
          </a>
        </div>

        <div class="error-icon-circle">
          <!-- Modern page unavailable / broken link icon -->
          <svg
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            width="34"
            height="34"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="1.8"
              d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
            />
          </svg>
        </div>

        <div class="error-code">404</div>
        <h1
          style="
            font-size: 1.85rem;
            font-weight: 700;
            margin-bottom: 12px;
            color: #ffffff;
          "
        >
          Page Unavailable
        </h1>
        <p
          style="
            color: #cbd5e1;
            max-width: 480px;
            margin: 0 auto 28px;
            font-size: 0.98rem;
            line-height: 1.6;
          "
        >
          The page you are looking for is currently unavailable, has been moved,
          or does not exist. Please check the URL or use the buttons below to
          navigate back to safety.
        </p>

        <!-- Quick Navigation Links -->
        <div
          style="
            display: flex;
            justify-content: center;
            gap: 14px;
            flex-wrap: wrap;
          "
        >
          <a href="../index.html" class="btn btn-primary btn-lg">
            <svg
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              width="18"
              height="18"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"
              />
            </svg>
            <span>Return to Home</span>
          </a>
          <button onclick="history.back()" class="btn btn-secondary btn-lg">
            <span>Go Back</span>
          </button>
        </div>
      </div>
    </main>

    <script src="../assets/js/storage.js"></script>
    <script src="../assets/js/main.js"></script>
  </body>
</html>
